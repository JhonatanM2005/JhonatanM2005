name: Generate Space Shooter

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/space-shooter.yml"

permissions:
  contents: write

jobs:
  space-shooter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate Space Shooter GIF
        uses: czl9707/gh-space-shooter@main
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          output-path: gh-space-shooter.gif
          strategy: random
          fps: "40"
