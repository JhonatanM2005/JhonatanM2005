<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img" aria-label="GastroForge - MULTI-TENANT SAAS">
  <defs>
    <clipPath id="card-clip-02">
      <rect x="0" y="0" width="412" height="182" rx="12"/>
    </clipPath>
  </defs>

  <!-- Hard shadow (MENDEX pop-minimal) -->
  <rect x="6" y="6" width="412" height="182" rx="12" fill="#F2B632"/>

  <!-- Main card surface -->
  <rect x="0.75" y="0.75" width="410.5" height="180.5" rx="11.5" fill="#120E0E" stroke="#3A302C" stroke-width="1.5"/>

  <!-- Subtle halftone corner -->
  <g opacity="0.85">
    <circle cx="342" cy="22" r="1.6" fill="#3A302C"/>
    <circle cx="355" cy="22" r="1.6" fill="#3A302C"/>
    <circle cx="368" cy="22" r="1.6" fill="#3A302C"/>
    <circle cx="381" cy="22" r="1.6" fill="#3A302C"/>
    <circle cx="394" cy="22" r="1.6" fill="#3A302C"/>
    <circle cx="342" cy="35" r="1.6" fill="#3A302C"/>
    <circle cx="355" cy="35" r="1.6" fill="#3A302C"/>
    <circle cx="368" cy="35" r="1.6" fill="#3A302C"/>
    <circle cx="381" cy="35" r="1.6" fill="#3A302C"/>
    <circle cx="394" cy="35" r="1.6" fill="#3A302C"/>
    <circle cx="342" cy="48" r="1.6" fill="#3A302C"/>
    <circle cx="355" cy="48" r="1.6" fill="#3A302C"/>
    <circle cx="368" cy="48" r="1.6" fill="#3A302C"/>
    <circle cx="381" cy="48" r="1.6" fill="#3A302C"/>
    <circle cx="394" cy="48" r="1.6" fill="#3A302C"/>
  </g>

  <!-- Animated top accent sweep -->
  <g clip-path="url(#card-clip-02)">
    <rect x="0" y="0" width="412" height="3" fill="#241D1B"/>
    <rect x="-120" y="0" width="120" height="3" fill="#F2B632">
      <animate attributeName="x" values="-120;420" dur="3.6s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Index + Category -->
  <rect x="24" y="20" width="28" height="20" rx="4" fill="#241D1B" stroke="#F2B632" stroke-width="1"/>
  <text x="38" y="34" text-anchor="middle" fill="#F2B632" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">02</text>
  <text x="62" y="34" fill="#B3A79C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8">MULTI-TENANT SAAS</text>

  <!-- Pulsing status badge -->
  <g>
    <circle cx="332.4" cy="30" r="3.5" fill="#F2B632">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" begin="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle cx="332.4" cy="30" r="3.5" fill="none" stroke="#F2B632" stroke-width="1.2">
      <animate attributeName="r" values="3.5;9" dur="2s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2s" begin="0.35s" repeatCount="indefinite"/>
    </circle>
    <text x="342.4" y="34" fill="#F4EDE4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.6">PRIVATE</text>
  </g>

  <!-- Title + CTA -->
  <text x="24" y="72" fill="#F4EDE4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.3">GastroForge</text>
  <text x="392" y="70" text-anchor="end" fill="#B3A79C" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">PRIVATE REPO</text>

  <!-- Description -->
  <text x="24" y="98" fill="#B3A79C" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5">Restaurant ERP monorepo with PostgreSQL RLS,</text>
  <text x="24" y="116" fill="#B3A79C" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12.5">OpenAPI TypeScript codegen &amp; Redis telemetry.</text>

  <!-- Stack pills -->
  <rect x="24" y="148" width="79" height="22" rx="4" fill="#241D1B" stroke="#3A302C" stroke-width="1"/><text x="63.5" y="162.5" text-anchor="middle" fill="#F4EDE4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">NestJS 11</text>
  <rect x="110" y="148" width="121" height="22" rx="4" fill="#241D1B" stroke="#3A302C" stroke-width="1"/><text x="170.5" y="162.5" text-anchor="middle" fill="#F4EDE4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">React Router v7</text>
  <rect x="238" y="148" width="58" height="22" rx="4" fill="#241D1B" stroke="#3A302C" stroke-width="1"/><text x="267.0" y="162.5" text-anchor="middle" fill="#F4EDE4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">Prisma</text>
  <rect x="303" y="148" width="86" height="22" rx="4" fill="#241D1B" stroke="#3A302C" stroke-width="1"/><text x="346.0" y="162.5" text-anchor="middle" fill="#F4EDE4" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5">PostgreSQL</text>
</svg>
